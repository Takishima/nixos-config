name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Pull requests build only the checks they change, and so only the hosts
  # they change. Pushes to main and manual runs build all of them.
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    env:
      HOSTS: >-
        [{"system": "x86_64-linux", "host": "homelinux", "runner": "ubuntu-latest"}]
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31
        if: github.event_name == 'pull_request'

      # `nix build` of single checks skips what `nix flake check` evaluates
      # besides them: the modules, overlays and packages.
      - name: Evaluate the flake
        if: github.event_name == 'pull_request'
        run: nix flake check --no-build --all-systems

      - name: Choose the checks
        id: plan
        env:
          BASE: github:${{ github.repository }}/${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            changed=$(.github/scripts/changed-checks.sh "$BASE")
          else
            changed=null
          fi
          # A host with no changed check gets no job.
          matrix=$(jq -cn --argjson hosts "$HOSTS" --argjson changed "$changed" '{
            include: [
              $hosts[]
              | .checks = (if $changed == null then "all" else $changed[.system] // [] | join(" ") end)
              | select(.checks != "")
            ]
          }')
          echo "$matrix" | jq .
          echo "matrix=$matrix" >>"$GITHUB_OUTPUT"

  flake-check:
    needs: plan
    if: fromJSON(needs.plan.outputs.matrix).include[0] != null
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: flake-check (${{ matrix.host }})
    runs-on: ${{ matrix.runner }}
    env:
      # Fork and Dependabot PRs get no secrets, so they build on the runner.
      HAVE_NIXBUILD: ${{ secrets.NIXBUILD_TOKEN != '' }}
    steps:
      # The desktop closure does not fit in the runner's default free space.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-substituters = https://nix-community.cachix.org https://devenv.cachix.org
            extra-trusted-public-keys = nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= devenv.cachix.org-1:w1cLUi8dv3hnoSPGAuibQv+f9TZLr6cv/Hm9XgU50cw=
            keep-going = true

      - uses: cachix/cachix-action@v16
        with:
          name: dn-personal
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          # Only push-cache.sh pushes: the action would upload every closure,
          # unfree packages included, to this public cache.
          skipPush: true

      # Builds everything on nixbuild.net and copies the results back.
      # CI fails once the token expires. To make a new one, for a year:
      #   ssh eu.nixbuild.net shell
      #   tokens create --ttl-seconds 31536000 -p build:read -p build:write -p store:read -p store:write
      - uses: nixbuild/nixbuild-action@v27
        if: env.HAVE_NIXBUILD == 'true'
        with:
          nixbuild_token: ${{ secrets.NIXBUILD_TOKEN }}
          generate_summary_for: job

      # The action sets up SSH for the runner user only, but the Nix daemon
      # connects as root. Copy the SSH config to root, with the token in it.
      - name: Give the Nix daemon access to nixbuild.net
        if: env.HAVE_NIXBUILD == 'true'
        run: |
          awk '/^SetEnv / {
            print "SetEnv NIXBUILDNET_TOKEN=\"" ENVIRON["NIXBUILDNET_TOKEN"] "\" " substr($0, 8)
            next
          } 1' "${NIX_SSHOPTS#-F}" | sudo install -D -m 600 /dev/stdin /root/.ssh/config
          sudo "$(command -v nix)" store info --store ssh://nixbuild

      - name: Build the checks
        env:
          SYSTEM: ${{ matrix.system }}
          CHECKS: ${{ matrix.checks }}
        run: |
          if [ "$CHECKS" = all ]; then
            nix flake check -L
          else
            echo "Changed checks: $CHECKS"
            installables=()
            for check in $CHECKS; do installables+=(".#checks.$SYSTEM.$check"); done
            nix build -L --no-link "${installables[@]}"
          fi

      # Not for pull requests from forks, which get no token.
      - name: Push to Cachix
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: .github/scripts/push-cache.sh dn-personal
