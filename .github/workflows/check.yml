name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flake-check:
    runs-on: ubuntu-latest
    env:
      # False for pull requests from forks and Dependabot, which get no
      # secrets: those build on the runner instead.
      HAVE_NIXBUILD: ${{ secrets.NIXBUILD_TOKEN != '' }}
    steps:
      # The desktop closure does not fit in the runner's default free space.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-substituters = https://nix-community.cachix.org https://devenv.cachix.org
            extra-trusted-public-keys = nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= devenv.cachix.org-1:w1cLUi8dv3hnoSPGAuibQv+f9TZLr6cv/Hm9XgU50cw=
            keep-going = true

      - uses: cachix/cachix-action@v16
        with:
          name: dn-personal
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          # Only push-cache.sh pushes: the action would upload every closure,
          # unfree packages included, to this public cache.
          skipPush: true

      # Builds everything on nixbuild.net (max-jobs = 0), VM tests included,
      # and uses its store as a substituter. Results are copied back to the
      # runner, so push-cache.sh sees them. The token comes from
      # `tokens create` in `ssh eu.nixbuild.net shell`, with the permissions
      # build:read, build:write, store:read and store:write.
      - uses: nixbuild/nixbuild-action@v27
        if: env.HAVE_NIXBUILD == 'true'
        with:
          nixbuild_token: ${{ secrets.NIXBUILD_TOKEN }}
          generate_summary_for: job

      - run: nix flake check -L

      # Not for pull requests from forks, which get no token.
      - name: Push to Cachix
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: .github/scripts/push-cache.sh dn-personal
